# askr-html is a native Quarto format extension; consumer content and runtime stay native.
title: Askr
author: arfiligol
version: 0.4.2
quarto-required: ">=1.9.38 <1.11"
contributes:
  formats:
    html:
      theme:
        light: [default, qdk.scss]
        dark: [default, qdk.scss, qdk-dark.scss]
      theme-toggle: true
      include-in-header: theme-color.html
      toc: true
      page-layout: article
